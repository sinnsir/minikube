name: Rapport de bug (Français)
description: Signalez un bug pour nous aider à améliorer minikube
labels: ["kind/bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de remplir ce rapport de bug ! Veuillez remplir le formulaire aussi complètement que possible.
  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Une description claire et concise du bug.
      placeholder: Décrivez le bug ici...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Une description claire et concise de ce que vous attendiez.
      placeholder: Décrivez ce que vous attendiez...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes pour reproduire
      description: Étapes pour reproduire le comportement.
      placeholder: |
        1. Exécuter '...'
        2. Voir l'erreur '...'
    validations:
      required: true
  - type: textarea
    id: minikube-version
    attributes:
      label: Version de minikube
      description: Exécutez `minikube version` et collez la sortie ici.
      placeholder: |
        minikube version: v1.x.x
        commit: ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Exécutez `minikube logs` et collez la sortie ici. Fournissez également des informations sur votre système d'exploitation et votre pilote.
      placeholder: |
        - Système d'exploitation: [ex. Ubuntu 22.04, macOS 13, Windows 11]
        - Pilote: [ex. docker, virtualbox, hyperkit]
        - Architecture: [ex. amd64, arm64]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journaux de sortie
      description: Copiez et collez les journaux pertinents. Ceux-ci seront automatiquement formatés en code.
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Contexte supplémentaire
      description: Ajoutez tout autre contexte concernant le problème ici.
    validations:
      required: false
