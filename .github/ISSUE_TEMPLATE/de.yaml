name: Bug Report (Deutsch)
description: Melden Sie einen Fehler, um uns bei der Verbesserung zu helfen
title: "[Bug] "
labels: ["kind/bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Vielen Dank, dass Sie sich die Zeit nehmen, diesen Fehler zu melden!
        Bitte füllen Sie das folgende Formular so vollständig wie möglich aus.
  - type: textarea
    id: beschreibung
    attributes:
      label: Fehlerbeschreibung
      description: Eine klare und präzise Beschreibung des Fehlers.
      placeholder: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: reproduktion
    attributes:
      label: Schritte zur Reproduktion
      description: Schritte zur Reproduktion des Verhaltens.
      placeholder: |
        1. Führen Sie '...' aus
        2. Klicken Sie auf '...'
        3. Scrollen Sie nach unten zu '...'
        4. Fehler wird angezeigt
    validations:
      required: true
  - type: textarea
    id: erwartetes-verhalten
    attributes:
      label: Erwartetes Verhalten
      description: Eine klare und präzise Beschreibung des erwarteten Verhaltens.
    validations:
      required: true
  - type: textarea
    id: umgebung
    attributes:
      label: Umgebung
      description: |
        Bitte geben Sie folgende Informationen an:
        - Betriebssystem und Version
        - minikube Version (`minikube version`)
        - Kubernetes Version (`kubectl version`)
        - Treiber (z.B. docker, virtualbox, hyperv)
      placeholder: |
        - OS: Ubuntu 22.04
        - minikube: v1.30.0
        - kubectl: v1.27.0
        - Treiber: docker
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevante Logs
      description: Fügen Sie relevante Log-Ausgaben ein. Dieser Bereich wird automatisch als Code formatiert.
      render: shell
  - type: textarea
    id: zusaetzlicher-kontext
    attributes:
      label: Zusätzlicher Kontext
      description: Fügen Sie hier weiteren Kontext oder Screenshots zum Problem hinzu.
